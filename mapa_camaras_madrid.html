<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaDrive · Mapa de Cámaras de Tráfico</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            color: #222;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #1a3a5c 0%, #1e5799 50%, #1a3a5c 100%);
            padding: 13px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 2px 12px rgba(0, 60, 140, 0.35);
            z-index: 1000;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
        }

        .legend {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: #ddeeff;
        }

        .dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            flex-shrink: 0;
        }

        .dot-green {
            background: #22cc44;
            box-shadow: 0 0 7px #22cc44;
        }

        .line-blue {
            width: 22px;
            height: 4px;
            background: #1565c0;
            border-radius: 2px;
            flex-shrink: 0;
        }

        header>span {
            font-size: 12px;
            color: rgba(200, 225, 255, 0.85);
            margin-left: auto;
        }

        #stats-bar {
            background: #fff;
            padding: 7px 24px;
            display: flex;
            gap: 28px;
            font-size: 12px;
            border-bottom: 2px solid #e0e8f4;
            flex-shrink: 0;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        .stat {
            display: flex;
            gap: 5px;
            align-items: center;
            color: #444;
        }

        .stat strong {
            color: #1565c0;
            font-size: 14px;
        }

        #loading-bar {
            background: #fff3cd;
            border-bottom: 2px solid #ffc107;
            padding: 6px 24px;
            font-size: 12px;
            color: #856404;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #ffc107;
            border-top-color: #856404;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #map {
            flex: 1;
            width: 100%;
        }

        /* Popups */
        .leaflet-popup-content-wrapper {
            background: #fff;
            color: #222;
            border: 2px solid #1565c0;
            border-radius: 10px;
            box-shadow: 0 6px 24px rgba(0, 60, 140, 0.18);
        }

        .leaflet-popup-tip {
            background: #fff;
        }

        .custom-popup h3 {
            color: #1565c0;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .custom-popup p {
            font-size: 12px;
            margin: 3px 0;
            color: #444;
        }

        .cam-btn {
            display: inline-block;
            margin-top: 8px;
            background: #1565c0;
            color: white;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 11px;
            text-decoration: none;
        }

        /* Legend panel */
        #legend-panel {
            background: rgba(255, 255, 255, 0.97);
            border: 1.5px solid #c5d8f5;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 12px;
            font-family: 'Segoe UI', sans-serif;
            min-width: 180px;
            box-shadow: 0 4px 18px rgba(0, 60, 140, 0.13);
            color: #222;
        }

        #legend-panel .title {
            color: #1565c0;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 13px;
        }

        #legend-panel .road-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 4px 0;
        }

        .road-line {
            width: 22px;
            height: 3px;
            background: #1565c0;
            border-radius: 2px;
        }

        .road-count {
            color: #1565c0;
            margin-left: auto;
            font-weight: 600;
        }

        .legend-footer {
            margin-top: 8px;
            padding-top: 7px;
            border-top: 1px solid #dde;
            color: #888;
            font-size: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🚦 MaDrive</h1>
        <div class="legend">
            <div class="legend-item">
                <div class="dot dot-green"></div>
                <span>Cámara analizada</span>
            </div>
            <div class="legend-item">
                <div class="line-blue"></div>
                <span>Tramo de carretera con cámaras</span>
            </div>
        </div>
        <span>Sistema de Análisis de Tráfico · Madrid</span>
    </header>

    <div id="stats-bar">
        <div class="stat">📷 Cámaras: <strong id="total-cams">0</strong></div>
        <div class="stat">🛣️ Carreteras: <strong id="total-roads">0</strong></div>
        <div class="stat">📍 Zona: <strong>Comunidad de Madrid</strong></div>
        <div class="stat" id="road-status" style="margin-left:auto; color:#888;"></div>
    </div>

    <div id="loading-bar" id="loading-bar">
        <div class="spinner"></div>
        Cargando geometría real de carreteras desde OpenStreetMap… (puede tardar unos segundos)
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // ─────────────────────────────────────────────
        // DATOS DE CÁMARAS (coordenadas reales DGT)
        // ─────────────────────────────────────────────
        let CAMARAS = []

        // ─────────────────────────────────────────────
        // MAPA — fondo blanco (OSM estándar claro)
        // ─────────────────────────────────────────────
        const map = L.map('map', { center: [40.46, -3.70], zoom: 11 });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · © <a href="https://carto.com/">CARTO</a> · Datos DGT',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // ─────────────────────────────────────────────
        // ICONO VERDE PARA CÁMARAS
        // ─────────────────────────────────────────────
        function makeIcon(size = 14) {
            return L.divIcon({
                className: '',
                html: `<div style="
      width:${size}px; height:${size}px;
      background:#22cc44;
      border:2.5px solid #fff;
      border-radius:50%;
      box-shadow:0 0 8px #22cc4488, 0 2px 5px rgba(0,0,0,0.25);
      cursor:pointer;
    "></div>`,
                iconSize: [size, size],
                iconAnchor: [size / 2, size / 2]
            });
        }

        // ─────────────────────────────────────────────
        // MARCADORES
        // ─────────────────────────────────────────────
        const roadsSet = new Set();
        const roadGroups = {};

        fetch('/api/zonas')
        .then(res => res.json())
        .then(data => {

            if (data.success && data.camaras) {

                CAMARAS = data.camaras;

                CAMARAS.forEach(cam => {

                    // 🔴 evitar coordenadas inválidas
                    if (!cam.lat || !cam.lon) return;

                    roadsSet.add(cam.road);

                    if (!roadGroups[cam.road]) roadGroups[cam.road] = [];
                    roadGroups[cam.road].push([cam.lat, cam.lon]);

                    const imgUrl = `https://infocar.dgt.es/etraffic/data/camaras/${cam.id}.jpg`;

                    L.marker([cam.lat, cam.lon], { icon: makeIcon() })
                        .addTo(map)
                        .bindPopup(`
                            <div class="custom-popup">
                                <h3>📷 Cámara ${cam.id}</h3>
                                <p>🛣️ <strong>Carretera:</strong> ${cam.road}</p>
                                <p>📍 <strong>PK:</strong> ${cam.pk} km</p>
                                <p>🌐 <strong>Coords:</strong> ${cam.lat.toFixed(5)}, ${cam.lon.toFixed(5)}</p>
                                <br/>
                                <img src="${imgUrl}" width="220"
                                    style="border-radius:6px;border:1.5px solid #1565c0;display:block;margin-bottom:6px;"
                                    onerror="this.style.display='none'" />
                                <a href="${imgUrl}" target="_blank" class="cam-btn">🔗 Ver imagen en directo</a>
                            </div>
                        `, { maxWidth: 260 });

                });

                // ✅ contadores
                document.getElementById('total-cams').textContent = CAMARAS.length;
                document.getElementById('total-roads').textContent = roadsSet.size;

                // ✅ ajustar mapa
                map.fitBounds(CAMARAS.map(c => [c.lat, c.lon]), { padding: [40, 40] });

                // ✅ actualizar leyenda
                const legendPanelDiv = document.getElementById('legend-panel');
                if (legendPanelDiv) {
                    renderLegend(legendPanelDiv, 'Cámaras BD cargadas');
                }
            }
        })
        .catch(err => console.error("Error cargando cámaras:", err));

        document.getElementById('total-cams').textContent = CAMARAS.length;
        document.getElementById('total-roads').textContent = roadsSet.size;

        map.fitBounds(CAMARAS.map(c => [c.lat, c.lon]), { padding: [40, 40] });

        // ─────────────────────────────────────────────
        // LEYENDA FLOTANTE
        // ─────────────────────────────────────────────
        const legendCtrl = L.control({ position: 'bottomright' });
        legendCtrl.onAdd = function () {
            const div = L.DomUtil.create('div', '');
            div.id = 'legend-panel';
            renderLegend(div, 'Cargando…');
            return div;
        };
        legendCtrl.addTo(map);

        function renderLegend(div, status) {
            const roads = [...roadsSet].sort();
            div.innerHTML = `
    <div class="title">🛣️ Carreteras analizadas</div>
    ${roads.map(r => `
      <div class="road-row">
        <div class="road-line"></div>
        <span>${r}</span>
        <span class="road-count">${roadGroups[r].length} 📷</span>
      </div>
    `).join('')}
    <div class="legend-footer">
      ${CAMARAS.length} cámaras · ${roads.length} carreteras<br/>
      <span style="color:#aaa;">${status}</span>
    </div>
  `;
        }

        // ─────────────────────────────────────────────
        // CARRETERAS REALES — Overpass API
        // Busca los tramos exactos de cada carretera
        // dentro del bbox de Madrid
        // ─────────────────────────────────────────────
        const BBOX = '39.90,-4.25,40.85,-3.15'; // bbox amplio para cubrir M-614, N-6, A-3

        // Carreteras presentes en el dataset
        const ROAD_REFS = ['A-1', 'A-2', 'A-3', 'A-4', 'A-5', 'A-6', 'A-42', 'M-40', 'M-50', 'M-614', 'N-6'];

        const overpassQuery = `
[out:json][timeout:50];
(
  way["highway"]["ref"="A-1"](${BBOX});
  way["highway"]["ref"="A-2"](${BBOX});
  way["highway"]["ref"="A-3"](${BBOX});
  way["highway"]["ref"="A-4"](${BBOX});
  way["highway"]["ref"="A-5"](${BBOX});
  way["highway"]["ref"="A-6"](${BBOX});
  way["highway"]["ref"="A-42"](${BBOX});
  way["highway"]["ref"="M-40"](${BBOX});
  way["highway"]["ref"="M-50"](${BBOX});
  way["highway"]["ref"="M-614"](${BBOX});
  way["highway"]["ref"="N-6"](${BBOX});
);
out geom;
`;

        const overpassUrl =
            'https://overpass-api.de/api/interpreter?data=' +
            encodeURIComponent(overpassQuery);

        // Capa de carreteras reales (se añade DEBAJO de los marcadores)
        const roadLayer = L.layerGroup().addTo(map);

        fetch(overpassUrl)
            .then(r => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(data => {
                // Agrupar segmentos por ref
                const waysByRef = {};
                data.elements.forEach(el => {
                    if (el.type !== 'way' || !el.geometry) return;
                    const ref = el.tags && el.tags.ref;
                    if (!ref || !ROAD_REFS.includes(ref)) return;
                    if (!waysByRef[ref]) waysByRef[ref] = [];
                    waysByRef[ref].push(el.geometry.map(p => [p.lat, p.lon]));
                });

                // Dibujar cada carretera en azul
                Object.entries(waysByRef).forEach(([ref, segments]) => {
                    segments.forEach(coords => {
                        L.polyline(coords, {
                            color: '#1565c0',
                            weight: 5,
                            opacity: 0.80,
                            smoothFactor: 1.5,
                            lineJoin: 'round',
                            lineCap: 'round'
                        })
                            .addTo(roadLayer)
                            .bindTooltip(`🛣️ ${ref}`, { sticky: true, className: '' });
                    });
                });

                // Ocultar barra de carga
                document.getElementById('loading-bar').style.display = 'none';
                const total = Object.values(waysByRef).reduce((s, a) => s + a.length, 0);
                document.getElementById('road-status').textContent =
                    `✅ ${total} segmentos cargados`;
                renderLegend(
                    document.getElementById('legend-panel'),
                    `${total} segmentos OSM cargados`
                );
            })
            .catch(err => {
                // Si falla Overpass, trazar líneas aproximadas conectando cámaras
                console.warn('Overpass falló, usando líneas aproximadas:', err);
                document.getElementById('loading-bar').innerHTML =
                    '⚠️ No se pudo cargar OSM. Mostrando tramos aproximados entre cámaras.';
                document.getElementById('loading-bar').style.background = '#fff3cd';

                Object.entries(roadGroups).forEach(([road, points]) => {
                    if (points.length < 2) return;
                    points.sort((a, b) => a[1] - b[1]);
                    L.polyline(points, {
                        color: '#1565c0', weight: 5, opacity: 0.75, smoothFactor: 2
                    }).addTo(roadLayer)
                        .bindTooltip(`🛣️ ${road} (aprox.)`, { sticky: true });
                });
                setTimeout(() => {
                    document.getElementById('loading-bar').style.display = 'none';
                }, 4000);
                renderLegend(
                    document.getElementById('legend-panel'),
                    'Tramos aproximados (OSM no disponible)'
                );
            });

    </script>
</body>

</html>
